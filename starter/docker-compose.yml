services:
  service:
    build: ./service
    ports: ["8080:8080"]
    environment:
      - GATEWAY_URL=http://gateway:4000
      - DB_CONN=Host=postgres;Database=llmops;Username=llmops;Password=llmops
    depends_on: [gateway, postgres]

  gateway:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["4000:4000"]
    volumes:
      - ./gateway/litellm-config.yaml:/app/config.yaml:ro
    env_file:
      - ./gateway/.env

  mock-provider:
    build: ./mock-provider
    ports: ["9000:9000"]

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=llmops
      - POSTGRES_PASSWORD=llmops
      - POSTGRES_DB=llmops
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data

  # --- optional (advanced), вмикати профілем: docker compose --profile advanced up ---
  redis:
    image: redis:7
    profiles: ["advanced"]
    ports: ["6379:6379"]

volumes:
  pgdata:
